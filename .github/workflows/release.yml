# Builds the Windows app (installer and zip) and the Linux command line. On a
# pull request it only checks that they build (and that the smoke test
# passes); on a "v*" tag it also creates a DRAFT release with the files and
# their SHA-256 sums — the maintainer reviews it and clicks Publish.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "label=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            # not a release: a version nobody will mistake for one
            echo "version=0.0.0-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "label=ci-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Smoke test
        run: |
          sudo apt-get install -y --no-install-recommends sqlite3 > /dev/null
          dotnet build src/Acrux.Cli -c Release
          tests/smoke/run.sh src/Acrux.Cli/bin/Release/net10.0/Acrux.Cli
      - name: "Publish the command line (self-contained: no .NET needed)"
        run: |
          dotnet publish src/Acrux.Cli/Acrux.Cli.csproj -c Release -r linux-x64 \
            --self-contained true -p:Version=${{ needs.version.outputs.version }} -o out/acrux-cli
          ln -s Acrux.Cli out/acrux-cli/acrux
          cp LICENSE out/acrux-cli/
          out/acrux-cli/acrux version
          tar -czf acrux-cli-${{ needs.version.outputs.label }}-linux-x64.tar.gz -C out acrux-cli
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: acrux-cli-*.tar.gz
          retention-days: 7

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Publish the desktop app (single file, self-contained)
        shell: pwsh
        run: |
          dotnet publish src/Acrux.WinForms/Acrux.WinForms.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:Version=${{ needs.version.outputs.version }} -o out
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item out/Acrux.exe, LICENSE pkg/
          Copy-Item assets/brand/NOTICE.md pkg/NOTICE-logo.md
          Compress-Archive -Path pkg/* -DestinationPath Acrux-${{ needs.version.outputs.label }}-win-x64.zip
      - name: "Installer (Inno Setup: a folder publish, plus the VC++ runtime if missing)"
        shell: pwsh
        run: |
          dotnet publish src/Acrux.WinForms/Acrux.WinForms.csproj -c Release -r win-x64 `
            --self-contained true -p:Version=${{ needs.version.outputs.version }} -o out-setup
          choco install innosetup --version 6.7.1 -y --no-progress --allow-downgrade | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = '${{ needs.version.outputs.version }}'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp `
            "/DAppVersion=$version" "/DNumericVersion=$(($version -split '-')[0])" `
            "/DLabel=${{ needs.version.outputs.label }}" "/DPublishDir=$PWD\out-setup" `
            "/O$PWD" installer\acrux.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            Acrux-*.zip
            Acrux-*-setup.exe
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum Acrux-*-setup.exe Acrux-*.zip acrux-cli-*.tar.gz > SHA256SUMS
          cat > notes.md <<'EOF'
          **Windows app** — run `Acrux-…-setup.exe`: it installs Acrux for your user,
          without admin rights. If the Microsoft Visual C++ runtime that Acrux needs
          is missing, setup downloads it from Microsoft and Windows asks for
          permission to install it.

          Or, without installing: unzip `Acrux-…-win-x64.zip` and run `Acrux.exe`
          (the .NET runtime is inside). This one needs the [Microsoft Visual C++
          Redistributable (x64)](https://aka.ms/vs/17/release/vc_redist.x64.exe),
          which most PCs already have; without it, opening a file fails with "Dll
          was not found".

          Neither file is code-signed yet, so Windows SmartScreen warns about an
          unknown publisher: **More info → Run anyway**. Signing is on its way
          through the SignPath Foundation: see the [Code signing
          policy](https://github.com/${{ github.repository }}#code-signing-policy).

          **Command line, Linux** — extract `acrux-cli-…-linux-x64.tar.gz` and put the
          `acrux-cli` folder on your `PATH` (the `acrux` link inside starts it); no
          .NET needed.

          Check a download against `SHA256SUMS`: `sha256sum -c SHA256SUMS
          --ignore-missing` on Linux, `Get-FileHash <file>` on Windows.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Acrux $GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            Acrux-*-setup.exe Acrux-*.zip acrux-cli-*.tar.gz SHA256SUMS
